<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tarefas
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tarefas</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    @if (todos().length > 0) {
      <app-todo-list [todos]="todos()"></app-todo-list>
    } @else {
      <h3>Nenhum todo encontrado</h3>
    } 
  </ion-content>
</ion-content>
