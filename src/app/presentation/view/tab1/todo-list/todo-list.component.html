<ion-grid>
  <ion-col>
    <h3>Lista de tarefas pendentes</h3>
    @for (todo of penddingTodoList(); track todo.id) {
      <ion-row class="ion-padding-start">
        <ion-checkbox labelPlacement="end" [checked]="todo.done" (ionChange)="handleCheboxChange($event.detail, todo.id)"> {{ todo.name }} </ion-checkbox>
      </ion-row>
    }
  </ion-col>
  <ion-col>
    <h3>Lista de tarefas completas</h3>
    @for (todo of doneTodoList(); track todo.id) {
      <ion-row class="ion-padding-start">
        <ion-checkbox labelPlacement="end" [checked]="todo.done" (ionChange)="handleCheboxChange($event.detail, todo.id)"> {{ todo.name }} </ion-checkbox>
      </ion-row>
    }
  </ion-col>
</ion-grid>
